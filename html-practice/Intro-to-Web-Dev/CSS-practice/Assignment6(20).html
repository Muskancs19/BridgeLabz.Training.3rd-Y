<!DOCTYPE html>
<html lang="en">
<head>

    <!-- The title defines the page title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- The meta charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- The meta description describes the webpage -->
    <meta name="description"
          content="A webpage demonstrating important HTML head elements.">

    <!-- The meta author identifies the webpage author -->
    <meta name="author" content="Muskan Kumari">

    <!-- The base tag defines the base URL for relative links -->
    <base href="https://example.com/">

    <!-- The link tag connects an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used for CSS; left empty as required -->
    <style>
    </style>

    <!-- The script tag is used for JavaScript; left empty as required -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>

    <p>
        This page demonstrates the important elements used inside
        the HTML head section.
    </p>

</body>
</html>

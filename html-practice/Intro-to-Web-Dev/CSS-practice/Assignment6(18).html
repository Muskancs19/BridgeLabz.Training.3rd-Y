<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <!-- Long quotation -->
    <blockquote>
        Learning HTML is an important first step in web development.
        HTML provides the structure of a webpage and allows us to use
        entities such as &amp;.

    <!-- Short quotation -->
    <p>
        My teacher says, <q>Practice makes perfect.</q>
    </p>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My City Map</title>
</head>
<body>

    <h1>Google Map</h1>

    <!-- The loading="lazy" attribute delays loading the map until it is needed,
         which can improve the initial loading performance of the page. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
